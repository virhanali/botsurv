# Paper mode + DeepSeek LLM + Bybit WS
app:
  mode: paper
  log_level: debug
  json_logs: true
  cycle_interval_seconds: 900
  max_cycle_overlap: false
  timezone: UTC

database:
  driver: postgres
  dsn: "postgres://botsurv:botsurv@localhost:5432/botsurv?sslmode=disable"
  pool:
    max_open_conns: 10
    max_idle_conns: 5
    conn_max_lifetime_seconds: 1800

market_data:
  provider: bybit_ws
  symbols:
    mode: all_usdt_perpetual
    explicit_list: []
  ws_url: "wss://stream.bybit.com/v5/public/linear"
  rest_url: "https://api.bybit.com"
  reconnect_interval_seconds: 5
  stale_data_threshold_seconds: 300
  backfill_candles: 500
  start_timeout_seconds: 300
  timeframes:
    - 15m
    - 1H
    - 4H
  orderbook_depth: 50
  trade_flow_windows:
    - 15
    - 60
    - 300


data_validation:
  min_candles: 250
  max_data_age_seconds:
    "1m": 30
    "5m": 7200
    "15m": 1200
    "1H": 4500
    "4H": 18000

hard_blocks:
  max_spread_pct: 0.15
  max_funding_abs_pct: 0.5
  btc_flash_crash_5m_pct: -2.5
  daily_max_loss_pct: 3.0
  max_consecutive_losses: 3
  cooldown_after_loss_min: 30
  cooldown_after_win_min: 10

indicator_engine:
  ema20_period: 20
  ema50_period: 50
  ema200_period: 200
  rsi_period: 14
  macd_fast_period: 12
  macd_slow_period: 26
  macd_signal_period: 9
  atr_period: 14
  volume_ma_period: 20
  swing_lookback: 3
  recent_swing_count: 5
  support_resistance_atr_tolerance: 1.0

market_regime:
  btc_dump_short_pct: -2.5
  btc_dump_medium_pct: -3.0
  btc_near_level_atr_buffer: 1.0
  btcd_rising_fast_pct: 0.8
  relative_strength:
    strong_outperform_pct: 2.0
    strong_underperform_pct: -2.0
    neutral_band_pct: 0.5
    smoothed_ema_period: 8

scoring:
  mode: balanced
  scoring_version: v0.1.0
  balanced:
    allow_market: 75
    allow_retest_only: 65
    reduce_size: 55
  aggressive:
    allow_market: 70
    allow_retest_only: 60
    reduce_size: 50

broker:
  provider: paper
  paper:
    starting_balance_usd: 1000.0
    fee_maker_bps: 2.0
    fee_taker_bps: 5.5
    slippage_model: fixed_bps
    slippage_bps: 5.0
    default_leverage: 20

universe:
  mode: all_usdt_perpetual
  refresh_interval_minutes: 60
  light_scan_max_symbols: 100
  quality_filter_max_symbols: 30
  setup_scan_max_symbols: 10
  core_symbols: []
  force_include_symbols: []
  blacklist: []
  external_signal_watchlist:
    enabled: true
    ttl_hours: 48
  filters:
    min_24h_volume_usd: 500000
    max_spread_bps: 50
    min_atr_health_score: 30

strategy:
  enabled: true
  timeframes:
    context: 1H
    setup: 15m
    execution: 5m
  indicators:
    atr_period: 14
    ema200_period: 200
    volume_sma_period: 20
    range_candles: 20
    min_volume_ratio: 1.3
    max_breakout_extension_atr: 2.5
    max_distance_from_breakout_atr: 1.0
    min_rr: 1.15
    expected_move_cost_multiplier: 3.0
  regime:
    trend_up_min_distance_from_ema_pct: 1.0
    trend_down_max_distance_from_ema_pct: -1.0
    range_max_distance_from_ema_pct: 0.5
  entry_types:
    - MARKET
    - LIMIT_RETEST
  limit_retest_ttl_minutes: 30

llm_routing:
  mode: dynamic
  min_candidate_score: 50
  max_calls_per_cycle: 0
  max_calls_per_day: 200
  max_cost_usd_per_day: 20.0
  require_execution_ok: false
  require_liquidity_ok: false
  hard_cap_candidates_per_cycle: 0

llm:
  enabled: true
  provider: deepseek
  base_url: "https://api.deepseek.com"
  model: "deepseek-v4-pro"
  temperature: 0
  timeout_seconds: 60
  max_tokens: 4096
  budget:
    max_cost_usd_per_day: 3.0
    fallback_decision: BLOCK

portfolio_risk:
  max_open_positions: 5
  max_new_positions_per_cycle: 3
  max_total_exposure_usd: 500
  max_total_margin_used_pct: 50
  max_risk_per_trade_pct: 0.5
  max_daily_loss_pct: 5.0
  max_same_direction_positions: 3
  max_correlated_alt_positions: 2
  max_per_symbol_position: 1
  margin_per_trade_usd: 5
  max_leverage: 20
  min_notional_usd: 5
  cooldown_after_losses:
    enabled: true
    consecutive_losses: 3
    cooldown_minutes: 60

sizing:
  method: min_margin_or_risk
  margin_per_trade_usd: 5
  max_leverage: 20
  max_risk_per_trade_pct: 0.5

alerts:
  enabled: false
  provider: telegram
  telegram:
    bot_token: ""
    chat_id: ""
  webhook:
    url: ""
  events:
    - bot_started
    - bot_halted
    - preflight_failed
    - market_data_stale
    - ws_reconnect_loop
    - llm_fallback_block_spike
    - llm_budget_exceeded
    - trade_executed
    - protective_order_failure
    - emergency_close
    - daily_loss_kill_switch
    - portfolio_risk_limit_spike
    - broker_db_mismatch
    - orphan_position
    - db_error
    - live_mode_attempted_without_guard

backtest:
  default_from: "2024-01-01"
  default_to: "2024-12-31"
  llm_mode: mock
