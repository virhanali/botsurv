app:
  mode: paper
  log_level: info
  json_logs: true
  cycle_interval_seconds: 900
  max_cycle_overlap: false
  timezone: UTC

database:
  driver: postgres
  dsn: "${DATABASE_DSN}"
  pool:
    max_open_conns: 10
    max_idle_conns: 5
    conn_max_lifetime_seconds: 1800

market_data:
  provider: bybit_ws
  symbols:
    mode: all_usdt_perpetual
    explicit_list: []
  ws_url: "wss://stream.bybit.com/v5/public/linear"
  rest_url: "https://api.bybit.com"
  reconnect_interval_seconds: 5
  stale_data_threshold_seconds: 30
  backfill_candles: 500
  start_timeout_seconds: 300
  timeframes:
    - 15m
    - 1H
  orderbook_depth: 50
  trade_flow_windows:
    - 15
    - 60
    - 300

broker:
  provider: paper
  paper:
    starting_balance_usd: 1000.0
    fee_maker_bps: 2.0
    fee_taker_bps: 5.5
    slippage_model: fixed_bps
    slippage_bps: 5.0
    default_leverage: 5

universe:
  mode: hybrid
  refresh_interval_minutes: 60
  light_scan_max_symbols: 100
  quality_filter_max_symbols: 30
  setup_scan_max_symbols: 10
  core_symbols: []
  force_include_symbols: []
  blacklist: []
  external_signal_watchlist:
    enabled: true
    ttl_hours: 48
  filters:
    min_24h_volume_usd: 500000
    max_spread_bps: 50
    min_atr_health_score: 30

strategy:
  enabled: true
  timeframes:
    context: 1H
    setup: 15m
    execution: 5m
  indicators:
    atr_period: 14
    ema200_period: 200
    volume_sma_period: 20
    range_candles: 20
    min_volume_ratio: 1.3
    max_breakout_extension_atr: 2.5
    max_distance_from_breakout_atr: 1.0
    min_rr: 2.0
    expected_move_cost_multiplier: 3.0
  regime:
    trend_up_min_distance_from_ema_pct: 1.0
    trend_down_max_distance_from_ema_pct: -1.0
    range_max_distance_from_ema_pct: 0.5
  entry_types:
    - MARKET
    - LIMIT_RETEST
  limit_retest_ttl_minutes: 30

llm_routing:
  mode: dynamic
  min_candidate_score: 75
  max_calls_per_cycle: 0
  max_calls_per_day: 0
  max_cost_usd_per_day: 3.0
  require_execution_ok: true
  require_liquidity_ok: true
  hard_cap_candidates_per_cycle: 0

llm:
  enabled: false
  provider: openrouter
  base_url: "https://openrouter.ai/api/v1"
  model: "openai/gpt-5.5"
  temperature: 0
  timeout_seconds: 30
  max_tokens: 512
  budget:
    max_cost_usd_per_day: 3.0
    fallback_decision: BLOCK

portfolio_risk:
  max_open_positions: 3
  max_new_positions_per_cycle: 2
  max_total_exposure_usd: 300
  max_total_margin_used_pct: 50
  max_risk_per_trade_pct: 0.5
  max_daily_loss_pct: 3.0
  max_same_direction_positions: 2
  max_correlated_alt_positions: 2
  max_per_symbol_position: 1
  margin_per_trade_usd: 100
  max_leverage: 5
  min_notional_usd: 5
  cooldown_after_losses:
    enabled: true
    consecutive_losses: 3
    cooldown_minutes: 60

sizing:
  method: min_margin_or_risk
  margin_per_trade_usd: 100
  max_leverage: 5
  max_risk_per_trade_pct: 0.5

alerts:
  enabled: true
  provider: telegram
  telegram:
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"
  webhook:
    url: ""
  events:
    - bot_started
    - bot_halted
    - preflight_failed
    - market_data_stale
    - ws_reconnect_loop
    - llm_fallback_block_spike
    - llm_budget_exceeded
    - trade_executed
    - protective_order_failure
    - emergency_close
    - daily_loss_kill_switch
    - portfolio_risk_limit_spike
    - broker_db_mismatch
    - orphan_position
    - db_error
    - live_mode_attempted_without_guard

backtest:
  default_from: "2024-01-01"
  default_to: "2024-12-31"
  llm_mode: mock

